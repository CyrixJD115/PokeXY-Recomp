[package]
name = "xy-heatmap"
version = "2.0.0"
edition = "2021"
description = "Progress-heatmap studio for the Pokémon X/Y recomp + decomp project: axum + Svelte UI, deterministic SVG/PNG export"

# Standalone package — deliberately NOT a member of the repo-root workspace
# (the workspace owns the xy extraction toolkit; this is a self-contained app).
[workspace]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip", "set-header"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
sha1 = "0.10"
sha2 = "0.10"
flate2 = "1"
thiserror = "2"
resvg = "0.45"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }

[profile.release]
strip = true
lto = true
