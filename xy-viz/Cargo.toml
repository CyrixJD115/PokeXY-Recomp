[package]
name = "xy-viz"
description = "README visualization assets for the heatmap: charming (ECharts) renders of the central treemap + progress bar from heatmap_data.json"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Vendored: upstream 0.6.0 Treemap has no `data` field — we add TreemapNode
# + data + upperLabel (see vendor/charming/src/series/treemap.rs). Drop the
# vendored copy once upstream lands treemap data support.
charming = { path = "vendor/charming", features = ["ssr"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
