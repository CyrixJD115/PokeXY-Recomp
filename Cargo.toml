[workspace]
resolver = "2"
members = [
    "xy-extraction/xy-core",
    "xy-extraction/xy-archive",
    "xy-extraction/xy-audio",
    "xy-extraction/xy-gfx",
    "xy-extraction/xy-script",
    "xy-extraction/xy-battle",
    "xy-extraction/xy-curate",
    "xy-extraction/xy-convert",
    "xy-viz",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["cyrixjd115"]

# Unified `xy` CLI frontend (subcommand groups map 1:1 onto the crates above).
[package]
name = "xy"
description = "Unified CLI for the Pokemon X/Y (kujira) decompilation toolkit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
xy-core = { path = "xy-extraction/xy-core" }
xy-archive = { path = "xy-extraction/xy-archive" }
xy-audio = { path = "xy-extraction/xy-audio" }
xy-gfx = { path = "xy-extraction/xy-gfx" }
xy-script = { path = "xy-extraction/xy-script" }
xy-battle = { path = "xy-extraction/xy-battle" }
xy-curate = { path = "xy-extraction/xy-curate" }
xy-convert = { path = "xy-extraction/xy-convert" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
